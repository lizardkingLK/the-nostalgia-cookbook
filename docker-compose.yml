version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Self-Hosted Open-Weight Model Engine (Ollama - Gemma 2 & Whisper)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: nostalgia-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - nostalgia-network

  # ---------------------------------------------------------------------------
  # The Nostalgia Cookbook Web Application
  # ---------------------------------------------------------------------------
  nostalgia-app:
    container_name: nostalgia-cookbook
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - ollama
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-nostalgia-secret-key-32-chars-minimum}
      - MONGODB_URI=${MONGODB_URI:-}

      # Harness the open-weight model directly inside the Docker network
      - GEMMA_API_ENDPOINT=${GEMMA_API_ENDPOINT:-http://ollama:11434/api/generate}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma2:9b}
      - GEMMA_API_KEY=${GEMMA_API_KEY:-ollama}
    volumes:
      - nostalgia_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nostalgia-network

volumes:
  ollama_models:
  nostalgia_data:

networks:
  nostalgia-network:
    driver: bridge
